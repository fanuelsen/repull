steps:
  # Step 1: Run tests
  test:
    image: golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    commands:
      - go test -v ./...
    when:
      event:
        - pull_request
        - tag
        - push

  # Step 2: Security audit
  security:
    image: golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    commands:
      # Pinned instead of @latest so a compromised release can't silently run
      # in CI; the renovate comment keeps the pin current (customManagers in
      # renovate.json).
      # renovate: datasource=go depName=golang.org/x/vuln
      - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - |
        set +e
        govulncheck ./... > /tmp/vuln.out 2>&1
        RESULT=$$?
        set -e
        cat /tmp/vuln.out
        if [ "$$RESULT" -eq 0 ]; then
          echo "No vulnerabilities found."
          exit 0
        elif [ "$$RESULT" -eq 3 ]; then
          FIXABLE=$$(grep "Fixed in:" /tmp/vuln.out | grep -cv "N/A" || true)
          if [ "$$FIXABLE" -gt 0 ]; then
            echo ""
            echo "FAILED: $$FIXABLE fixable vulnerabilities. Update dependencies."
            exit 1
          fi
          echo ""
          echo "Only unfixable vulnerabilities (no patch available). Passing."
          exit 0
        else
          echo "govulncheck error (exit code $$RESULT)"
          exit 1
        fi
    when:
      event:
        - pull_request
        - tag
        - push

  # Step 3: Scan the pinned runtime base image for known CVEs
  # Digest pinning (supply-chain integrity) means base-image updates only
  # arrive via Renovate PRs; this step covers the gap by failing the build
  # when the pinned base carries a fixable HIGH/CRITICAL vulnerability.
  # --ignore-unfixed matches the govulncheck step's philosophy: only fail on
  # what an update can actually fix. Scans via the registry API
  # (--image-src remote), so no Docker daemon is needed. Go dependencies are
  # deliberately not scanned here — govulncheck above already covers them,
  # call-graph-aware.
  trivy:
    image: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    commands:
      - BASE=$$(grep '^FROM' Dockerfile | tail -n1 | cut -d' ' -f2)
      - echo "Scanning runtime base image $${BASE}"
      - trivy image --image-src remote --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$${BASE}"
    when:
      event:
        - pull_request
        - tag
        - push

  # Step 4: Build binary
  build:
    image: golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    commands:
      - apk add --no-cache git
      - go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-dev}" -trimpath -o repull ./cmd/repull
      - ls -lh repull
    when:
      event:
        - pull_request
        - tag
        - push

  # Step 5: Auto-tag patch release on push to main
  auto-tag:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    commands:
      - apk add --no-cache git
      - git fetch --tags
      - |
        if git tag --points-at HEAD | grep -q '^v'; then
          echo "HEAD already has a version tag, skipping"
          exit 0
        fi
      - |
        git config user.email "ci@repull"
        git config user.name "Woodpecker CI"
        LATEST=$$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
        if [ -z "$$LATEST" ]; then
          NEW_TAG="v0.1.0"
        else
          MAJOR=$$(echo "$$LATEST" | cut -d. -f1)
          MINOR=$$(echo "$$LATEST" | cut -d. -f2)
          PATCH=$$(echo "$$LATEST" | cut -d. -f3)
          PATCH=$$(($$PATCH + 1))
          NEW_TAG="v$${MAJOR}.$${MINOR}.$${PATCH}"
        fi
        echo "Tagging $$NEW_TAG"
        git tag -a "$$NEW_TAG" -m "Auto-release $$NEW_TAG"
        # Keep the token out of the URL: git prints the remote URL in error
        # messages ("fatal: unable to access 'https://...'"), which would leak
        # the token into CI logs on a failed push. The helper reads it from the
        # environment at push time instead; same credentials as before
        # (username "token", token as password).
        git config credential.helper '!f() { echo "username=token"; echo "password=$${CI_FORGE_TOKEN}"; }; f'
        git push "${CI_FORGE_URL}/${CI_REPO}.git" "$$NEW_TAG"
    environment:
      CI_FORGE_TOKEN:
        from_secret: forgejo_token
    when:
      event:
        - push
      branch:
        - main

  # Step 6: Build and push Docker image on tag
  # Images are pinned by digest: these steps receive registry and forge
  # credentials, and a mutable reference (:latest, or even a re-pushed
  # version tag) would let a compromised plugin release run with them —
  # and poison the published repull image. The tag stays for readability;
  # the digest is what the daemon verifies. Renovate maintains both
  # (pinDigests in renovate.json).
  docker-release:
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings:
      repo: fanuelsen/repull
      dockerfile: Dockerfile
      platforms: linux/amd64
      build_args:
        VERSION: ${CI_COMMIT_TAG}
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event:
        - tag

  # Step 7: Create Forgejo release with binary
  forgejo-release:
    image: woodpeckerci/plugin-release:0.3.2@sha256:a045e18674319a2e3e534b5b674c100a0f01a9fc718dd03ab6732155b228e61b
    settings:
      base_url: ${CI_FORGE_URL}
      api_key:
        from_secret: forgejo_token
      files:
        - repull
      title: "Repull ${CI_COMMIT_TAG}"
      note: |
        ## Repull ${CI_COMMIT_TAG}

        ### Docker Image
        ```bash
        docker pull fanuelsen/repull:${CI_COMMIT_TAG}
        ```

        ### Binary
        Download `repull` from assets below.

        ### Install
        ```bash
        chmod +x repull
        sudo mv repull /usr/local/bin/repull
        ```
      checksum:
        - sha256
      file_exists: skip
    when:
      event:
        - tag
